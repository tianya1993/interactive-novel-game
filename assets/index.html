<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互动小说游戏平台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header id="main-header">
      <h1 class="game-title">互动小说游戏</h1>
      <p class="game-subtitle">历史穿越 · 系统�?· AI 驱动</p>
    </header>

    <!-- 玩家状态栏 -->
    <div class="player-hud" id="player-hud" style="display: none;">
      <div class="player-info">
        <div class="player-avatar" id="hud-avatar">�?/div>
        <div class="player-details">
          <h3 id="hud-player-name">游客</h3>
          <div class="player-level">Lv.1 冒险�?/div>
        </div>
      </div>
      <div class="player-stats">
        <div class="stat-item">
          <div class="stat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1ed760" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
          </div>
          <div class="stat-value" id="score">1000</div>
          <div class="stat-label">积分</div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3b3b3" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
          </div>
          <div class="stat-value">0</div>
          <div class="stat-label">战斗�?/div>
        </div>
        <div class="stat-item">
          <div class="stat-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b3b3b3" stroke-width="2"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>
          </div>
          <div class="stat-value">0</div>
          <div class="stat-label">成就</div>
        </div>
      </div>
    </div>

    <!-- 主菜�?-->
    <div id="main-menu" class="game-types">
      <div class="game-card" data-type="history">
        <span class="game-card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1ed760" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </span>
        <h2>历史穿越</h2>
        <p>穿越到历史时期，改变历史或生存发展。你可以选择成为皇帝、将军、谋士，体验不同朝代的风云变幻�?/p>
        <div class="game-tags">
          <span class="tag">穿越</span>
          <span class="tag">历史</span>
          <span class="tag">策略</span>
        </div>
      </div>
      <div class="game-card" data-type="system">
        <span class="game-card-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1ed760" stroke-width="1.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </span>
        <h2>系统�?/h2>
        <p>获得神秘系统，通过完成任务升级变强。签到、选择、神级系统，各种类型任你选择�?/p>
        <div class="game-tags">
          <span class="tag">系统</span>
          <span class="tag">升级</span>
          <span class="tag">爽文</span>
        </div>
      </div>
    </div>

    <div class="config-btn-wrapper">
      <button class="btn-config" onclick="openSettings()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        AI 配置
      </button>
    </div>

    <!-- 剧本列表 -->
    <div id="script-list-modal" class="game-interface">
      <div style="text-align: center; margin-bottom: 30px;">
        <h2 id="script-list-title">选择剧本</h2>
      </div>
      <div id="script-list-content" class="script-list"></div>
      <div style="text-align: center; margin-top: 30px;">
        <button class="game-header-btn text-btn" onclick="closeScriptList()">�?返回首页</button>
      </div>
    </div>

    <!-- 名称输入 -->
    <div id="name-input-modal" class="modal">
      <div class="modal-content">
        <h2>设置角色名称</h2>
        <input type="text" id="player-name-input" placeholder="输入角色名称..." onkeypress="if(event.key==='Enter')confirmName()">
        <div class="modal-actions">
          <button class="primary" onclick="confirmName()">开始游�?/button>
          <button class="secondary" onclick="backToMenuFromNameInput()">返回</button>
        </div>
      </div>
    </div>

    <!-- 自定义剧�?-->
    <div id="custom-game-modal" class="modal">
      <div class="modal-content">
        <h2>创作新剧�?/h2>
        <p style="color: var(--ink-muted); margin-bottom: var(--space-md); font-size: 14px;">描述你想要的游戏设定，AI 会为你生成独特的体验</p>
        <label class="modal-label">剧本名称</label>
        <input type="text" id="custom-game-name" placeholder="例如：末日求生、修仙世界、赛博朋�?..">
        <label class="modal-label">剧本设定（可选）</label>
        <textarea id="custom-game-desc" placeholder="描述世界观、角色身份、目标等..."></textarea>
        <label class="modal-label">角色名称</label>
        <input type="text" id="custom-player-name" placeholder="输入角色名称...">
        <div class="modal-actions">
          <button class="primary" onclick="startCustomGame()">开始游�?/button>
          <button class="secondary" onclick="closeCustomGameModal()">取消</button>
        </div>
      </div>
    </div>

    <!-- AI 设置 -->
    <div id="ai-settings-modal" class="modal">
      <div class="modal-content ai-settings">
        <h2>AI 配置</h2>
        <label class="modal-label">AI 服务�?/label>
        <select id="ai-provider-select" onchange="onProviderChange()">
          <option value="siliconflow">SiliconFlow（推荐，免费额度�?/option>
          <option value="deepseek">DeepSeek</option>
          <option value="openai">OpenAI</option>
          <option value="custom">自定�?API</option>
        </select>
        <div id="provider-info" style="color: var(--ink-subtle); font-size: 12px; margin-bottom: var(--space-md);"></div>
        <div id="custom-api-url-div" style="display: none;">
          <label class="modal-label">API URL</label>
          <input type="text" id="custom-api-url" placeholder="https://api.example.com/v1/chat/completions">
        </div>
        <label class="modal-label">模型选择</label>
        <select id="ai-model-select"><option value="">加载�?..</option></select>
        <label class="modal-label">API Key</label>
        <input type="password" id="api-key-input" placeholder="输入 API Key">
        <label style="color: var(--ink-muted); font-size: 14px; cursor: pointer; display: flex; align-items: center; margin-bottom: var(--space-lg);">
          <input type="checkbox" id="use-ai-checkbox"> 启用 AI 功能
        </label>
        <div class="modal-actions">
          <button class="primary" onclick="saveSettings()">保存设置</button>
          <button class="secondary" onclick="closeSettings()">取消</button>
        </div>
      </div>
    </div>

    <!-- 游戏界面 -->
    <div id="game-interface" class="game-interface">
      <div class="game-header">
        <button class="game-header-btn" onclick="returnToHome()" title="返回首页">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </button>
        <button class="game-header-btn" onclick="exportSave()" title="导出存档">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="game-header-btn" onclick="importSave()" title="导入存档">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <button class="game-header-btn" onclick="backToMenu()" title="退�?>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="story-display" class="story-display">
        <div id="dialogue-history" class="dialogue-history"></div>
        <div class="chat-input">
          <input type="text" id="user-input" placeholder="输入你的行动指令...">
          <button class="send-btn" id="send-btn">发�?/button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
